  --bg-primary: #03060f;
  --bg-panel: #070d1e;
  --bg-panel-2: #0a1428;
  --border-glow: #1e90ff;
  --accent-blue: #00aaff;
  --accent-blue-dim: #0a6fa8;
  --text-primary: #e6f1ff;
  --text-muted: #5a7a9a;
  --danger: #ff3366;
  --success: #00ff88;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

.mono {
  font-family: 'JetBrains Mono', monospace;
}

/* Grid background */
.grid-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(0, 170, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 170, 255, 0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 80%);
}

/* Glow orbs */
.glow-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  z-index: 0;
  pointer-events: none;
}

.glow-orb-1 {
  top: -100px;
  left: 20%;
  width: 400px;
  height: 400px;
  background: rgba(0, 100, 255, 0.12);
}

.glow-orb-2 {
  bottom: -150px;
  right: 10%;
  width: 500px;
  height: 500px;
  background: rgba(30, 144, 255, 0.08);
}

/* Panel */
.panel {
  background: var(--bg-panel);
  border: 1px solid rgba(30, 144, 255, 0.15);
  border-radius: 12px;
  position: relative;
  transition: border-color 0.25s ease;
}

.panel:hover {
  border-color: rgba(30, 144, 255, 0.3);
}

.panel-header {
  border-bottom: 1px solid rgba(30, 144, 255, 0.12);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Button */
.btn-primary {
  background: linear-gradient(135deg, #0066ff, #00aaff);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.btn-primary:hover:not(:disabled) {
  box-shadow: 0 0 20px rgba(0, 170, 255, 0.4);
  transform: translateY(-1px);
}

.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-secondary {
  background: transparent;
  color: var(--accent-blue);
  border: 1px solid rgba(30, 144, 255, 0.3);
  padding: 10px 20px;
  border-radius: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-secondary:hover {
  border-color: var(--accent-blue);
  background: rgba(0, 170, 255, 0.05);
}

/* Input */
.input-field {
  background: var(--bg-panel-2);
  border: 1px solid rgba(30, 144, 255, 0.15);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text-primary);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  width: 100%;
  transition: border-color 0.2s ease;
}

.input-field:focus {
  outline: none;
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 2px rgba(0, 170, 255, 0.1);
}

.input-field::placeholder {
  color: #3a5a7a;
}

/* Label */
.field-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 6px;
  display: block;
}

/* Stat card */
.stat-card {
  background: var(--bg-panel);
  border: 1px solid rgba(30, 144, 255, 0.1);
  border-radius: 12px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
  opacity: 0.5;
}

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.badge-active {
  background: rgba(0, 255, 136, 0.1);
  color: var(--success);
  border: 1px solid rgba(0, 255, 136, 0.2);
}

.badge-idle {
  background: rgba(30, 144, 255, 0.1);
  color: var(--accent-blue);
  border: 1px solid rgba(30, 144, 255, 0.2);
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-panel);
}
::-webkit-scrollbar-thumb {
  background: rgba(30, 144, 255, 0.2);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(30, 144, 255, 0.4);
}

/* Pulse animation for loading */
@keyframes pulse-glow {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.pulse {
  animation: pulse-glow 1.5s ease-in-out infinite;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 100;
  padding: 14px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slide-in 0.3s ease-out;
  max-width: 420px;
}

@keyframes slide-in {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.toast-success {
  background: rgba(0, 255, 136, 0.12);
  border: 1px solid rgba(0, 255, 136, 0.3);
  color: var(--success);
}

.toast-error {
  background: rgba(255, 51, 102, 0.12);
  border: 1px solid rgba(255, 51, 102, 0.3);
  color: var(--danger);
}

.toast-info {
  background: rgba(0, 170, 255, 0.12);
  border: 1px solid rgba(0, 170, 255, 0.3);
  color: var(--accent-blue);
}

/* Section title */
.section-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent-blue);
  font-weight: 700;
  margin-bottom: 0;
}

/* Tab */
.tab-btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
}

.tab-btn.active {
  background: rgba(0, 170, 255, 0.1);
  color: var(--accent-blue);
  border-color: rgba(0, 170, 255, 0.2);
}

.tab-btn:hover:not(.active) {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.03);
}

/* Animated line */
.scan-line {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
  animation: scan 3s linear infinite;
  opacity: 0.3;
}

@keyframes scan {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

try {
